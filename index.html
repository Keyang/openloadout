<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The site's content policy (docs/architecture.md, Contract 11, "Safety of run-time assets"). The site is static, so it
    is sent here and not as a header. Everything comes from the site itself:
      script-src   its own files; blob: for the worker a sprite made on a visit runs in (started from memory so that it
                   carries this policy); 'wasm-unsafe-eval' for the search library and the search model, which are WebAssembly.
                   No eval, no inline script, no other site.
      connect-src  the site only: nothing on the page, and nothing in that worker, can call another site.
      img-src      the site, plus pictures made in memory (data: and blob:).
      style-src    the site's style sheets, plus style attributes the pages set themselves.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Loadout</title>
  <!-- Asked for at once, not after the scripts that read it: the list of every asset. Low priority, so the page frame
       and the style sheet come first (tests/unit/site-first-paint.test.mjs). -->
  <link rel="preload" href="generated/catalog.json" as="fetch" crossorigin fetchpriority="low">
  <!-- Just enough style for the page frame below, so it shows on a slow connection before the style sheets arrive.
       The same values as app/css/base.css (:root, body, .top, .brand, .top-nav, .bag-link, .bag-count, .menu-btn, .home, .lede);
       change both together. Its letters are the system's: the site's own fonts come with the style sheets, so they do not
       hold up what matters first. -->
  <style>
    body { margin: 0; background: #ffffff; color: #000000; font: 400 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .top { min-height: 56px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 32px; padding: 0 32px; border-bottom: 1px solid #e5e5e2; box-sizing: border-box; }
    .brand { height: 56px; display: inline-flex; align-items: center; font: 600 21px/1 system-ui, sans-serif; color: #000000; text-decoration: none; }
    .top-nav { display: flex; gap: 24px; font-size: 14px; margin-right: auto; }
    .top-nav a { color: #5c5c5c; text-decoration: none; padding: 6px 0; }
    .bag-link { height: 32px; box-sizing: border-box; padding: 0 6px 0 12px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #cfcfcb; border-radius: 6px; font-size: 14px; font-weight: 500; color: #000000; text-decoration: none; }
    .bag-count { min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 4px; background: #000000; color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
    .menu-btn { display: none; }
    .home { max-width: 1184px; margin: 0 auto; padding: 48px 32px 96px; box-sizing: border-box; }
    .lede { font-size: 18px; line-height: 1.5; margin: 0; color: #5c5c5c; }
    @media (max-width: 860px) { .top { padding: 0 24px; } .home { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 720px) { .top { padding: 0 16px; column-gap: 8px; } .brand { margin-right: auto; } .top-nav { display: none; } .home { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <!-- The page frame and a loading line, drawn before the style sheets below have arrived (they hold up only what comes
       after them) and before any script has run. app/app.js replaces it; the header matches app/ui.js header(). -->
  <div id="app"><header class="top"><a class="brand" href="#/">Loadout</a><nav id="main-nav" class="top-nav" aria-label="Main"><a href="#/browse">Library</a> <a href="#/bundles">Kits</a> <a href="#/play">Play</a></nav><a class="bag-link" href="#/bag">Bag <span class="bag-count">0</span></a></header><main class="v2 home"><p class="lede">Loading…</p></main></div>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <!-- The shared look first (tokens, the frame, the components, the editing panel), then one sheet per page, each with
       one owner. -->
  <link rel="stylesheet" href="app/css/base.css">
  <link rel="stylesheet" href="app/css/landing.css">
  <link rel="stylesheet" href="app/css/library.css">
  <link rel="stylesheet" href="app/css/asset.css">
  <link rel="stylesheet" href="app/css/kits.css">
  <link rel="stylesheet" href="app/css/bag.css">
  <link rel="stylesheet" href="app/css/play.css">
  <script type="module" src="app/app.js"></script>
</body>
</html>
